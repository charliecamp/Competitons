<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Me To You Designs | Winner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#fff 0%,transparent 40%),linear-gradient(135deg,#fff7fa,#f7dfe9);padding:20px 10px 50px;color:#555}
.page{max-width:700px;margin:auto;text-align:center}.logo img{width:220px;max-width:75%;display:block;margin:0 auto 9px}.kicker{font-size:12px;letter-spacing:4px;color:#999;margin-bottom:20px}
.poster{background:#fff;border:3px solid #edc5d4;border-radius:32px;padding:38px 14px;box-shadow:0 25px 70px rgba(100,50,70,.18)}
.trophy{font-size:65px}.small{font-size:14px;letter-spacing:4px;color:#999;margin-top:7px}.title{font-size:39px;color:#b76e8a;margin:12px 0 24px}
.wbox{background:linear-gradient(135deg,#fff4f8,#fce0ea);border:3px solid #e6b4c7;border-radius:28px;padding:36px 10px}.label{font-size:13px;letter-spacing:4px;color:#999;margin-bottom:14px}.name{font-size:clamp(50px,14vw,88px);line-height:.92;font-weight:900;color:#b76e8a;word-break:break-word;text-shadow:0 5px 20px rgba(183,110,138,.25)}
.congrats{font-size:24px;font-weight:800;margin-top:24px}.prize{font-size:15px;color:#777;line-height:1.7;margin-top:10px}.time{font-size:12px;color:#999;line-height:1.7;margin-top:22px;padding-top:18px;border-top:1px solid #eadde2}.business{margin-top:24px;color:#b76e8a;font-weight:800}
.note{margin-top:18px;color:#888;font-size:13px;line-height:1.6}
@media(max-width:500px){.title{font-size:32px}.poster{padding:30px 10px}}
</style>
</head>
<body>
<div class="page">
<div class="logo"><img src="logo.PNG" alt="Me To You Designs"></div>
<div class="kicker">GIVEAWAY WINNER</div>
<div class="poster">
<div class="trophy">🏆</div>
<div class="small">WE HAVE A WINNER</div>
<div class="title">🎉 CONGRATULATIONS! 🎉</div>
<div class="wbox">
<div class="label">OUR WINNER IS</div>
<div class="name" id="name">WINNER</div>
<div class="congrats">🥳 Congratulations! ❤️</div>
<div class="prize">You've won a <strong>Personalised Memorial Print</strong> from <strong>Me To You Designs</strong>.</div>
<div class="time" id="time"></div>
</div>
<div class="business">Me To You Designs</div>
</div>
<div class="note">Thank you to everyone who entered and supported my small business. ❤️</div>
</div>
<script>
const name=document.getElementById("name"),time=document.getElementById("time"),winner=localStorage.getItem("giveawayWinner"),draw=localStorage.getItem("giveawayDrawTime");
if(winner)name.textContent="✨ "+winner+" ✨";
if(draw){const d=new Date(draw);time.innerHTML=`Winner drawn on <strong>${d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</strong><br>at <strong>${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true})}</strong>`}else time.textContent="Winner details will appear after the draw.";
</script>
</body>
</html>
